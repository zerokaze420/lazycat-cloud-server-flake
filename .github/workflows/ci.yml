name: CI

on:
  push:
    branches: [main]
    paths: ['**.nix', '.github/**', 'flake.lock']
  pull_request:
    branches: [main]
    paths: ['**.nix', '.github/**', 'flake.lock']
  workflow_dispatch:
  schedule:
    # Catch upstream nixpkgs / vendor CDN breakage even without a commit.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single source of truth: the matrices are read from the flake itself, so
  # adding a platform to flake.nix automatically adds CI jobs for it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.matrix.outputs.systems }}
      targets: ${{ steps.matrix.outputs.targets }}
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Resolve build targets and declared systems
        id: matrix
        run: |
          systems=$(nix eval --json .#systems)
          targets=$(nix eval --json .#ci.buildTargets)
          # Only targets whose system is actually declared in `systems` get a
          # native job; riscv64-linux is excluded here and handled below.
          include=$(jq -nc --argjson s "$systems" --argjson t "$targets" \
            '$t | to_entries | map(select(.key as $k | $s | index($k))) | map({ system: .key, runner: .value })')
          {
            echo "systems=$systems"
            echo "targets=$targets"
            echo "include=$include"
          } >> "$GITHUB_OUTPUT"

  eval:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake show
        run: nix flake show
      - name: Evaluate every declared system
        run: nix flake check --all-systems --no-build
      - name: Verify flake evaluation left the tree untouched
        run: git diff --exit-code --stat

  # riscv64 has no GitHub-hosted runner and nixpkgs cannot bootstrap a riscv64
  # stdenv from x86_64, so the package is cross-compiled with the native
  # bootstrap kept intact, then executed under user-mode emulation. Direct
  # qemu invocation is used instead of binfmt_misc registration, which needs
  # privileged setup and is flakier on hosted runners.
  riscv64:
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build the riscv64 cross package
        id: pkg
        run: |
          out=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.hclient-cli-riscv64)
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Assert the artefact is really RISC-V
        run: |
          file "${{ steps.pkg.outputs.out }}/lib/hclient-cli/.hclient-cli-wrapped" | tee /tmp/type.txt
          grep -q 'RISC-V' /tmp/type.txt
      - name: Smoke test under qemu user-mode emulation
        run: |
          qemu=$(nix build --no-link --print-out-paths --impure --expr \
            'let f = builtins.getFlake (toString ./.); p = import f.inputs.nixpkgs { system = "x86_64-linux"; }; in p.qemu-user')
          "$qemu/bin/qemu-riscv64" "${{ steps.pkg.outputs.out }}/lib/hclient-cli/.hclient-cli-wrapped" --help

  # Each target system is built on a matching native runner, so the produced
  # binary is always directly executable and the smoke test can run everywhere.
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        if: github.event_name == 'pull_request'
      # Optional binary cache. Activates only when a CACHIX_AUTH_TOKEN secret
      # exists, so forks and token-less runs still pass.
      - uses: cachix/cachix-action@v15
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: lazycat-cloud-server-flake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build default package
        run: |
          nix build --no-link --print-out-paths ".#packages.${{ matrix.system }}.default"
      - name: Build hclient-cli package
        run: nix build --no-link ".#packages.${{ matrix.system }}.hclient-cli"
      - name: Smoke test the wrapped binary
        run: |
          store_path=$(nix build --no-link --print-out-paths ".#packages.${{ matrix.system }}.default")
          test -x "$store_path/bin/hclient-cli"
          test -x "$store_path/lib/hclient-cli/.hclient-cli-wrapped"
          "$store_path/bin/hclient-cli" --help
